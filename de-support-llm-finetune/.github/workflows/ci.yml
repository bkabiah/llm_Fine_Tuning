name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies (no GPU/torch needed for these tests)
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run data schema tests
        run: pytest tests/ -v

      - name: Generate sample dataset (smoke test)
        run: |
          python data/generate_synthetic_data.py --n_examples 40 --seed 1 --out_dir /tmp/data_check
          test -f /tmp/data_check/train.jsonl
          test -f /tmp/data_check/val.jsonl
          test -f /tmp/data_check/test.jsonl
